# A LiteLLM proxy with a database, which its virtual keys need, for `just litellm-test`. Only on 127.0.0.1.
name: patchbay-litellm-test
services:
  db:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 2s
      retries: 30
  litellm:
    image: ghcr.io/berriai/litellm:v1.108.12
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      LITELLM_ENABLE_MCP_STDIO: "true"
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./srv:/srv:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["127.0.0.1:4555:4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 3s
      retries: 60

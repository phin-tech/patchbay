[package]
name = "patchbay-gateway"
description = "Patchbay's MCP gateway: one endpoint in front of every server, with their secrets and sign-ins."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
patchbay-core.workspace = true
rmcp = { version = "3.11", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "reqwest", "transport-streamable-http-server", "auth"] }
# The same versions rmcp uses, for its transports' headers and clients.
reqwest = { version = "0.13", default-features = false }
http = "1"
async-trait = "0.1"
serde_json = "1"
tokio-util = "0.7"
tower-service = "0.3"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true

# cargo-deny (`just lint`): the licences, sources and advisories every dependency is held to.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained crates that GPUI depends on are GPUI's to replace; the app's own choices are held to it.
unmaintained = "workspace"

[licenses]
# Permissive licences, which ask for a notice and nothing more of the app: the ones the template's dependencies use.
# A new dependency under another one fails `just lint` until it's added here, on purpose.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # rustls and aws-lc, for the gateway's HTTPS to remote servers.
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# The app's own crates aren't published, so their licence is whatever the app's is.
[licenses.private]
ignore = true

[bans]
# GPUI pulls in several versions of some crates; that's GPUI's to fix, not a reason to fail.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Typecase, and its patched gpui-base.
allow-git = ["https://git.phin.tech/sam/typecase.git"]

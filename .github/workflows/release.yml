# Builds and publishes a release when its tag arrives: the notarized app on the download page (apps.phin.tech), a
# GitHub release here, the Sparkle appcast and the Homebrew cask. `just cut <part>` bumps, commits and tags v<version>
# on main and pushes both. `just ship <part>` on a Mac does the whole release there instead, and its GitHub release
# pushes the same tag, so a tag that already has a release is left alone.
#
# Every secret comes from Infisical Cloud (the project Phin Tech's apps share, env prod), signed in with GitHub's OIDC
# token as a machine identity that only v* tags of this repository can use; its id is the repository variable
# INFISICAL_IDENTITY. GitHub stores none of them.
#   /     what app-release reads itself (release.toml [secrets]): APPLE_ID, TEAM_ID, APP_SPECIFIC_PASSWORD, P12,
#         P12_PASSPHRASE, SPARKLE_PRIVATE_KEY
#   /ci   what the runner needs around it: GH_TOKEN (this repository's release, the tap, apps-site's deploy),
#         CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (cf, for the download page)
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # GitHub's OIDC token, to sign in to Infisical

env:
  INFISICAL_PROJECT: ab5ef8f1-af05-4d58-875d-f0e28832d026
  INFISICAL_IDENTITY: ${{ vars.INFISICAL_IDENTITY }}
  CF_SEND_TELEMETRY: "false"
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Leave a tag that's released already alone
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is released already (just ship); nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.released.outputs.done != 'true'
        with:
          ref: main       # app-release publishes from main, at the tagged commit
          fetch-depth: 0  # tags and history, for the release notes

      - name: Check the tag is main's commit and Cargo.toml's version
        if: steps.released.outputs.done != 'true'
        run: |
          tag=$GITHUB_REF_NAME
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$tag^{commit}")" ] ||
            { echo "::error::main has moved past $tag; release it from a Mac (just notarize, just release)"; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$tag" ] || { echo "::error::$tag, but Cargo.toml says $version"; exit 1; }
          [ -n "$INFISICAL_IDENTITY" ] ||
            { echo "::error::Set the repository variable INFISICAL_IDENTITY to the machine identity's id"; exit 1; }

      - uses: astral-sh/setup-uv@v6
        if: steps.released.outputs.done != 'true'

      - name: Install tools
        if: steps.released.outputs.done != 'true'
        run: |
          brew install just infisical/get-cli/infisical
          npm install --global cf@1.0.0-beta.27
          rustup show active-toolchain || rustup toolchain install

      - name: Sign in to Infisical
        if: steps.released.outputs.done != 'true'
        run: |
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=infisical" | jq -r .value)
          token=$(infisical login --method=oidc-auth --machine-identity-id="$INFISICAL_IDENTITY" --jwt="$jwt" \
            --plain --silent)
          echo "::add-mask::$token"
          echo "INFISICAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Load the runner's secrets
        if: steps.released.outputs.done != 'true'
        run: |
          infisical export --projectId "$INFISICAL_PROJECT" --env prod --path /ci --format json > "$RUNNER_TEMP/ci.json"
          python3 - "$RUNNER_TEMP/ci.json" <<'PY'
          import json, os, sys
          secrets = {s["key"]: s["value"] for s in json.load(open(sys.argv[1]))}
          os.remove(sys.argv[1])
          for name in ("GH_TOKEN", "CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"):
              if not secrets.get(name):
                  sys.exit(f"{name} is missing from Infisical (prod, /ci)")
          with open(os.environ["GITHUB_ENV"], "a") as out:
              for name, value in secrets.items():
                  print(f"::add-mask::{value}")
                  out.write(f"{name}={value}\n")
          PY

      - name: Build, sign and notarize
        if: steps.released.outputs.done != 'true'
        run: just notarize

      - name: Publish
        if: steps.released.outputs.done != 'true'
        run: just release
